<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My単語帳</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; color: #333; }
        
        .deck-container { padding: 15px; border: 2px solid #2196F3; border-radius: 8px; margin-bottom: 20px; background: #e3f2fd; }
        .deck-container select { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px;}
        .deck-actions { display: flex; gap: 8px; margin-bottom: 10px; }
        .deck-actions input { flex: 1; padding: 8px; box-sizing: border-box; }
        .deck-actions button { background-color: #2196F3; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .deck-delete-btn { background-color: #ff9800; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 14px;}

        .form-container { padding: 15px; border: 2px solid #333; border-radius: 8px; margin-bottom: 10px; }
        .form-container input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        #addBtn { background-color: #4CAF50; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        
        .checkbox-container { display: flex; gap: 15px; margin-bottom: 20px; padding: 10px; background: #f0f0f0; border-radius: 8px; flex-wrap: wrap; }
        .checkbox-container label { cursor: pointer; font-size: 14px; }
        
        .word-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #f9f9f9; }
        .word-card h3 { margin: 0 0 10px 0; color: #222; }
        .word-card p { margin: 5px 0; font-size: 14px; }
        
        .card-actions { display: flex; justify-content: space-between; margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px; align-items: center; }
        .action-right { display: flex; gap: 8px; }

        /* 新設：移動用ドロップダウンのスタイル */
        .move-deck-container { font-size: 12px; color: #555; }
        .move-deck-container select { padding: 4px; font-size: 12px; border-radius: 4px; }

        .toggle-btn { background-color: #2196F3; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .edit-btn { background-color: #ffc107; color: #333; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .delete-btn { background-color: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>マイ単語帳</h2>

    <div class="deck-container">
        <label for="deckSelect"><strong>現在の単語帳:</strong></label>
        <select id="deckSelect" onchange="changeDeck()"></select>
        
        <div class="deck-actions">
            <input type="text" id="newDeckInput" placeholder="新しい単語帳の名前 (例: 英検用)">
            <button onclick="createDeck()">作成</button>
        </div>
        <button class="deck-delete-btn" onclick="deleteCurrentDeck()">現在の単語帳を削除</button>
    </div>

    <div class="form-container">
        <input type="text" id="wordInput" placeholder="単語 (例: apple)">
        <input type="text" id="meaningInput" placeholder="意味 (例: りんご)">
        <input type="text" id="exampleInput" placeholder="例文 (例: I eat an apple.)">
        <input type="text" id="translationInput" placeholder="例文の訳 (例: 私はりんごを食べる。)">
        <button id="addBtn" onclick="addOrUpdateWord()">単語を追加</button>
    </div>

    <div class="checkbox-container">
        <strong>全体表示設定:</strong>
        <label><input type="checkbox" id="checkWord" checked onchange="handleCheckboxChange()"> 単語</label>
        <label><input type="checkbox" id="checkMeaning" checked onchange="handleCheckboxChange()"> 意味</label>
        <label><input type="checkbox" id="checkExample" checked onchange="handleCheckboxChange()"> 例文</label>
        <label><input type="checkbox" id="checkTranslation" checked onchange="handleCheckboxChange()"> 訳</label>
    </div>

    <div id="wordList"></div>

    <script>
        let decks = {
            "メイン": []
        };
        let currentDeck = "メイン";
        let editIndex = -1;

        window.onload = function() {
            loadData();
        };

        function saveData() {
            localStorage.setItem('myDecksData', JSON.stringify(decks));
            localStorage.setItem('currentDeckName', currentDeck);
            
            const checkStates = {
                word: document.getElementById('checkWord').checked,
                meaning: document.getElementById('checkMeaning').checked,
                example: document.getElementById('checkExample').checked,
                translation: document.getElementById('checkTranslation').checked
            };
            localStorage.setItem('myCheckStates', JSON.stringify(checkStates));
        }

        function loadData() {
            const storedDecks = localStorage.getItem('myDecksData');
            
            if (storedDecks) {
                decks = JSON.parse(storedDecks);
                currentDeck = localStorage.getItem('currentDeckName') || Object.keys(decks)[0];
            } else {
                const oldWords = localStorage.getItem('myWordsData');
                if (oldWords) {
                    decks["メイン"] = JSON.parse(oldWords);
                }
            }

            if (!decks[currentDeck]) {
                currentDeck = Object.keys(decks)[0];
            }

            const storedChecks = localStorage.getItem('myCheckStates');
            if (storedChecks) {
                const checkStates = JSON.parse(storedChecks);
                document.getElementById('checkWord').checked = checkStates.word;
                document.getElementById('checkMeaning').checked = checkStates.meaning;
                document.getElementById('checkExample').checked = checkStates.example;
                document.getElementById('checkTranslation').checked = checkStates.translation;
            }

            renderDeckSelect();
            renderWords();
        }

        // --- 単語帳（デッキ）管理 ---

        function renderDeckSelect() {
            const select = document.getElementById('deckSelect');
            select.innerHTML = '';
            for (let deckName in decks) {
                const wordCount = decks[deckName].length; // ★単語数を取得
                const option = document.createElement('option');
                option.value = deckName;
                option.innerText = `${deckName} (${wordCount}語)`; // ★名前の横に単語数を表示
                if (deckName === currentDeck) {
                    option.selected = true;
                }
                select.appendChild(option);
            }
        }

        function changeDeck() {
            currentDeck = document.getElementById('deckSelect').value;
            editIndex = -1;
            clearInputs();
            saveData();
            renderWords();
        }

        function createDeck() {
            const newDeckName = document.getElementById('newDeckInput').value.trim();
            if (!newDeckName) {
                alert("単語帳の名前を入力してください！");
                return;
            }
            if (decks[newDeckName]) {
                alert("その名前の単語帳はすでに存在します！");
                return;
            }
            
            decks[newDeckName] = [];
            currentDeck = newDeckName;
            
            document.getElementById('newDeckInput').value = '';
            editIndex = -1;
            clearInputs();
            saveData();
            renderDeckSelect();
            renderWords();
        }

        function deleteCurrentDeck() {
            if (Object.keys(decks).length <= 1) {
                alert("単語帳が1つしかないので削除できません！（最低1つは必要です）");
                return;
            }
            if (confirm(`本当に単語帳「${currentDeck}」を削除しますか？\n中の単語もすべて消えます！`)) {
                delete decks[currentDeck];
                currentDeck = Object.keys(decks)[0];
                editIndex = -1;
                clearInputs();
                saveData();
                renderDeckSelect();
                renderWords();
            }
        }

        function clearInputs() {
            document.getElementById('wordInput').value = '';
            document.getElementById('meaningInput').value = '';
            document.getElementById('exampleInput').value = '';
            document.getElementById('translationInput').value = '';
            document.getElementById('addBtn').innerText = '単語を追加';
        }

        // --- 単語の操作機能 ---

        function addOrUpdateWord() {
            const word = document.getElementById('wordInput').value;
            const meaning = document.getElementById('meaningInput').value;
            const example = document.getElementById('exampleInput').value;
            const translation = document.getElementById('translationInput').value;

            if (!word || !meaning) {
                alert("単語と意味は入力してください！");
                return;
            }

            if (editIndex === -1) {
                decks[currentDeck].push({ word, meaning, example, translation, showAll: false });
            } else {
                decks[currentDeck][editIndex].word = word;
                decks[currentDeck][editIndex].meaning = meaning;
                decks[currentDeck][editIndex].example = example;
                decks[currentDeck][editIndex].translation = translation;
                editIndex = -1;
            }
            
            clearInputs();
            saveData();
            renderDeckSelect(); // ★追加時に件数を更新
            renderWords();
        }

        function editWord(index) {
            document.getElementById('wordInput').value = decks[currentDeck][index].word;
            document.getElementById('meaningInput').value = decks[currentDeck][index].meaning;
            document.getElementById('exampleInput').value = decks[currentDeck][index].example;
            document.getElementById('translationInput').value = decks[currentDeck][index].translation;
            
            editIndex = index;
            document.getElementById('addBtn').innerText = '単語を更新';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteWord(index) {
            decks[currentDeck].splice(index, 1);
            saveData();
            renderDeckSelect(); // ★削除時に件数を更新
            renderWords();
        }

        // ★新設：別の単語帳に移動する機能
        function moveWord(index, targetDeck) {
            if (targetDeck === currentDeck) return; // 同じ単語帳なら何もしない

            // 移動する単語のデータをコピー
            const wordToMove = decks[currentDeck][index];
            
            // 現在の単語帳から削除
            decks[currentDeck].splice(index, 1);
            
            // 目的の単語帳に追加
            decks[targetDeck].push(wordToMove);

            // もし編集中の単語を移動させてしまった場合は、入力欄をリセットして安全対策
            if (editIndex === index) {
                editIndex = -1;
                clearInputs();
            } else if (editIndex > index) {
                editIndex--; // 削除されたことで番号がズレるのを修正
            }

            saveData();
            renderDeckSelect(); // 件数の更新
            renderWords(); // 画面の再描画
        }

        function toggleShowAll(index) {
            decks[currentDeck][index].showAll = !decks[currentDeck][index].showAll;
            saveData();
            renderWords();
        }

        function handleCheckboxChange() {
            saveData();
            renderWords();
        }

        function renderWords() {
            const list = document.getElementById('wordList');
            list.innerHTML = ''; 

            const showWordGlobal = document.getElementById('checkWord').checked;
            const showMeaningGlobal = document.getElementById('checkMeaning').checked;
            const showExampleGlobal = document.getElementById('checkExample').checked;
            const showTranslationGlobal = document.getElementById('checkTranslation').checked;

            decks[currentDeck].forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'word-card';
                
                const displayWord = item.showAll || showWordGlobal;
                const displayMeaning = item.showAll || showMeaningGlobal;
                const displayExample = item.showAll || showExampleGlobal;
                const displayTranslation = item.showAll || showTranslationGlobal;

                let contentHTML = '';
                if (displayWord) contentHTML += `<h3>${item.word}</h3>`;
                if (displayMeaning) contentHTML += `<p><strong>意味:</strong> ${item.meaning}</p>`;
                if (displayExample) contentHTML += `<p><strong>例文:</strong> ${item.example}</p>`;
                if (displayTranslation) contentHTML += `<p><strong>訳:</strong> ${item.translation}</p>`;
                
                if (!displayWord && !displayMeaning && !displayExample && !displayTranslation) {
                    contentHTML = `<p style="color:#999; font-style:italic;">すべて非表示になっています</p>`;
                }

                const buttonText = item.showAll ? '非表示' : '表示';
                
                // ★カード内に他の単語帳のリストを作成してドロップダウン（<select>）にする
                let moveOptionsHTML = '';
                for (let dName in decks) {
                    const isSelected = (dName === currentDeck) ? 'selected' : '';
                    moveOptionsHTML += `<option value="${dName}" ${isSelected}>${dName}へ移動</option>`;
                }
                
                const actionsHTML = `
                    <div class="card-actions">
                        <button class="toggle-btn" onclick="toggleShowAll(${index})">${buttonText}</button>
                        
                        <!-- ★ここに移動用のドロップダウンを追加 -->
                        <div class="move-deck-container">
                            <select onchange="moveWord(${index}, this.value)">
                                ${moveOptionsHTML}
                            </select>
                        </div>

                        <div class="action-right">
                            <button class="edit-btn" onclick="editWord(${index})">編集</button>
                            <button class="delete-btn" onclick="deleteWord(${index})">削除</button>
                        </div>
                    </div>
                `;

                card.innerHTML = contentHTML + actionsHTML;
                list.appendChild(card);
            });
        }
    </script>
</body>
</html>
